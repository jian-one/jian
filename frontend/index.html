<!doctype html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f6f7f9" />
    <script>
      (() => {
        const theme = localStorage.getItem('jian.interface_theme') || localStorage.getItem('jian.theme') || 'light';
        if (theme === 'light' || theme === 'black' || theme === 'console') {
          document.documentElement.dataset.theme = theme;
          document.querySelector('meta[name="theme-color"]').setAttribute('content', theme === 'light' ? '#f6f7f9' : theme === 'black' ? '#050505' : '#09100f');
        }
      })();
    </script>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/app_icon.svg" type="image/svg+xml" />
    <title>Jian - 简</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
